<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLearn - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .header-bg {
            background: var(--gradient);
            border-radius: 0 0 24px 24px;
            padding: 32px 24px;
            position: relative;
        }
        .btn-back {
            position: absolute;
            top: 32px;
            right: 24px;
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-blue);
            font-size: 20px;
        }
        .header-title { color: white; font-size: 32px; font-weight: 800; margin-bottom: 8px; }
        .header-sub { color: rgba(255,255,255,0.9); font-size: 14px; line-height: 1.5; max-width: 90%; }
        
        .form-section {
            background: white;
            margin: 24px;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon-left { position: absolute; left: 16px; color: #A0A0A0; font-size: 18px; }
        .input-icon-right { position: absolute; right: 16px; color: var(--primary-blue); }
        .input-field {
            width: 100%;
            padding: 14px 44px;
            border: 1.5px solid #E0E0E0;
            border-radius: 12px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .input-field:focus { border-color: var(--primary-blue); }
        .input-field.valid { border-color: var(--primary-blue); }
        
        .form-options { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 24px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-gray); }
        .checkbox-label input { width: 16px; height: 16px; accent-color: var(--primary-blue); }
        .forgot-link { color: var(--primary-blue); font-weight: 600; }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-light-gray);
            font-size: 12px;
            font-weight: 600;
            margin: 24px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E0E0E0;
        }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
    </style>
</head>
<body>
    <div class="app-container w-480" style="margin: 0 auto;">
        <div class="header-bg">
            <button class="btn-back" onclick="window.location.href='welcome.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <h1 class="header-title">Log In</h1>
            <p class="header-sub">Masuk untuk Memulai Proses Pembelajaran Anda yang Menarik</p>
        </div>

        <div class="form-section">
            <div class="input-group">
                <label class="input-label">Alamat <span style="font-weight:400">Email</span></label>
                <div class="input-wrapper">
                    <span class="input-icon-left">✉️</span>
                    <input type="email" class="input-field valid" placeholder="contoh@email.com" value="Mila Novelia@gmail.com">
                    <span class="input-icon-right">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    </span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Kata <span style="font-weight:400">Sandi</span></label>
                <div class="input-wrapper">
                    <span class="input-icon-left">🔒</span>
                    <input type="password" class="input-field" placeholder="Masukkan kata sandi">
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox"> Ingat Aku!
                </label>
                <a href="#" class="forgot-link">Lupa Kata Sandi ?</a>
            </div>

            <button class="btn-primary" onclick="window.location.href='home.html'">Masuk Sekarang</button>

            <div class="divider">ATAU</div>

            <button class="btn-outline blue-border" onclick="window.location.href='signup.html'">
                <span style="font-weight: 400;">Baru di sini?</span> <span class="text-blue">Daftar</span>
            </button>
        </div>
    </div>
</body>
</html>
