<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLearn - Materi List</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-bg { background: var(--gradient); min-height: 100vh; display: flex; flex-direction: column; position: relative; }
        .bg-blobs { position: absolute; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
        .blob { position: absolute; border-radius: 50%; background: white; opacity: 0.12; }
        .blob1 { width: 400px; height: 400px; top: -100px; left: -200px; }
        .blob2 { width: 350px; height: 350px; top: 100px; right: -150px; }
        
        .header-section { padding: 32px 24px 48px; position: relative; z-index: 10; }
        .header-title { color: white; font-size: 26px; font-weight: 800; margin-bottom: 4px; }
        .header-sub { color: white; font-size: 18px; font-weight: 700; margin-bottom: 24px; }
        .header-illus { position: absolute; top: 20px; right: 20px; font-size: 80px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2)); }
        .header-link { color: rgba(255,255,255,0.8); font-size: 13px; text-decoration: none; position: absolute; bottom: 20px; right: 24px; }
        
        .mapel-list {
            background: rgba(255,255,255,0.95); border-radius: 28px 28px 0 0; padding: 24px;
            flex: 1; position: relative; z-index: 10; display: flex; flex-direction: column; gap: 12px;
        }
        .mapel-item {
            background: white; border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; gap: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-decoration: none; transition: transform 0.2s, box-shadow 0.2s;
        }
        .mapel-item:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .item-number {
            width: 40px; height: 40px; border-radius: 50%; background: var(--primary-cyan); color: white;
            display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0;
        }
        .item-content { flex: 1; display: flex; flex-direction: column; }
        .item-title { font-weight: 700; font-size: 16px; color: var(--text-dark); margin-bottom: 4px; }
        .item-sub { font-size: 12px; color: var(--text-light-gray); }
    </style>
</head>
<body>
    <div class="app-container w-600 page-bg" style="margin: 0 auto;">
        <div class="bg-blobs">
            <div class="blob blob1"></div>
            <div class="blob blob2"></div>
        </div>

        <div class="header-section">

            <div class="header-illus">📱✨</div>
            <a href="#" class="header-link">Lihat semuanya..</a>
        </div>

        <div class="mapel-list">
            <a href="pilih-kelas.html" class="mapel-item">
                <div class="item-number">1</div>
                <div class="item-content">
                    <div class="item-title">Biologi</div>
                    <div class="item-sub">Kelas 10 • 11 • 12</div>
                </div>
            </a>
            <a href="pilih-kelas.html" class="mapel-item">
                <div class="item-number">2</div>
                <div class="item-content">
                    <div class="item-title">Matematika</div>
                    <div class="item-sub">Kelas 10 • 11 • 12</div>
                </div>
            </a>
            <a href="pilih-kelas.html" class="mapel-item">

                <div class="item-content">
                    <div class="item-title">Kimia</div>
                    <div class="item-sub">Kelas 10 • 11 • 12</div>
                </div>
            </a>
            <a href="pilih-kelas.html" class="mapel-item">
                <div class="item-number">4</div>
                <div class="item-content">
                    <div class="item-title">Ekonomi</div>
                    <div class="item-sub">Kelas 10 • 11 • 12</div>
                </div>
            </a>
            <a href="pilih-kelas.html" class="mapel-item">
                <div class="item-number">5</div>
                <div class="item-content">
                    <div class="item-title">Pemograman</div>
                    <div class="item-sub">Kelas 10 • 11 • 12</div>
                </div>
            </a>
        </div>

        <!-- Bottom Navbar -->
        <div class="bottom-nav">
            <a href="home.html" class="nav-item">

                <span>Home</span>
            </a>
            <a href="recent-results.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                <span>Bookmark</span>
            </a>
            <a href="materi-list.html" class="nav-item active">

                <span>Document</span>
            </a>
            <a href="profile.html" class="nav-item">

                <span>Profile</span>

        </div>
    </div>
</body>
</html>
