<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLearn - Quiz Question</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .header-bg {
            background: var(--gradient);
            border-radius: 0 0 28px 28px;
            padding: 24px;
            height: 180px;
            display: flex;
            justify-content: space-between;
        }
        .btn-icon { color: white; display: inline-flex; }
        
        .timer-container {
            position: absolute;
            top: 144px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 20;
        }
        .timer-circle {
            position: absolute; width: 100%; height: 100%;
        }
        .timer-circle circle {
            fill: none; stroke: #E0E0E0; stroke-width: 4;
        }
        .timer-circle .progress {
            stroke: var(--primary-cyan); stroke-dasharray: 200; stroke-dashoffset: 40;
            transition: stroke-dashoffset 1s linear; transform: rotate(-90deg); transform-origin: 50% 50%;
        }
        .timer-text { font-size: 18px; font-weight: 600; color: var(--text-dark); position: relative; z-index: 2; }
        
        .question-card {
            background: white;
            border-radius: 20px;
            padding: 40px 24px 24px;
            margin: -40px 20px 20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            text-align: center;
        }
        .badge {
            position: absolute; top: 16px;
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; color: white;
        }
        .badge-correct { left: 16px; background: var(--primary-blue); }
        .badge-wrong { right: 16px; background: var(--error); }
        
        .progress-text { color: var(--primary-blue); font-weight: 600; font-size: 14px; margin-bottom: 16px; }
        .question-text { font-size: 16px; font-weight: 500; line-height: 1.6; color: var(--text-dark); }
        
        .answers-container {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .answer-btn {
            background: white;
            border: 1.5px solid #D0D0D0;
            border-radius: 12px;
            padding: 16px 20px;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .answer-btn:hover { border-color: var(--primary-blue); }
        .answer-btn.selected-correct { border-color: var(--primary-blue); color: var(--primary-blue); }
        .answer-btn.selected-wrong { border-color: var(--error); color: var(--error); }
        .answer-icon {
            width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .selected-correct .answer-icon { background: var(--primary-blue); color: white; font-size: 12px; }
        .selected-wrong .answer-icon { background: var(--error); color: white; font-size: 12px; }
        
        .next-btn { margin: 24px 20px; }
    </style>
</head>
<body>
    <div class="app-container" style="margin: 0 auto;">
        <div class="header-bg">
            <button class="btn-icon" onclick="window.location.href='quiz-list.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <button class="btn-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
            </button>
        </div>

        <div class="timer-container">
            <svg class="timer-circle" viewBox="0 0 72 72">
                <circle cx="36" cy="36" r="32"></circle>
                <circle class="progress" cx="36" cy="36" r="32"></circle>
            </svg>
            <span class="timer-text">18</span>
        </div>

        <div class="question-card">
            <div class="badge badge-correct">05</div>
            <div class="badge badge-wrong">07</div>
            <div class="progress-text">Pertanyaan 13 / 20</div>
            <p class="question-text">Proses fotosintesis pada tumbuhan terjadi di bagian sel yang disebut...?</p>
        </div>

        <div class="answers-container">
            <button class="answer-btn selected-correct" onclick="window.location.href='quiz-result.html'">
                <span>Nukleus</span>
                <div class="answer-icon">✔</div>
            </button>
            <button class="answer-btn">
                <span>Mitokondria</span>
            </button>
            <button class="answer-btn selected-wrong">
                <span>Kloroplas</span>
                <div class="answer-icon">✖</div>
            </button>
            <button class="answer-btn">
                <span>Ribosom</span>
            </button>
        </div>
        
        <button class="btn-primary next-btn" onclick="window.location.href='quiz-result.html'">Lanjut</button>
    </div>
</body>
</html>
