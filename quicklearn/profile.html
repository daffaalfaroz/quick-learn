<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLearn - Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .header-bg {
            background: var(--gradient);
            border-radius: 0 0 28px 28px;
            padding: 48px 24px 40px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .bg-blobs { position: absolute; width: 100%; height: 100%; top:0; left:0; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; background: white; opacity: 0.1; }
        .blob1 { width: 200px; height: 200px; top: -50px; left: -50px; }
        .blob2 { width: 150px; height: 150px; bottom: -20px; right: -20px; }
        
        .btn-settings { position: absolute; top: 24px; right: 24px; color: white; }
        
        .avatar-wrap { width: 90px; height: 90px; border-radius: 50%; background: #B0BEC5; border: 3px solid white; display: flex; align-items: center; justify-content: center; font-size: 40px; color: white; margin-bottom: 16px; position: relative; z-index: 2; }
        .profile-name { color: white; font-size: 22px; font-weight: 800; margin-bottom: 4px; position: relative; z-index: 2; }
        .profile-level { color: white; font-size: 14px; position: relative; z-index: 2; }
        
        .stats-section { padding: 24px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .stat-card {
            background: linear-gradient(135deg, #1E88E5, #00BCD4);
            border-radius: 16px; padding: 24px; color: white; text-align: center;
            display: flex; flex-direction: column; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .stat-val { font-size: 36px; font-weight: 800; margin-bottom: 4px; }
        .stat-label { font-size: 13px; opacity: 0.9; }
        
        .logout-wrap { margin-top: 24px; text-align: center; margin-bottom: 40px; }
        .btn-logout {
            background: white; border: 1.5px solid #D0D0D0; border-radius: 24px; padding: 12px 32px;
            color: var(--text-gray); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.2s; cursor: pointer;
        }
        .btn-logout:hover { border-color: var(--error); color: var(--error); }
    </style>
</head>
<body>
    <div class="app-container w-600" style="margin: 0 auto;">
        <div class="header-bg">
            <div class="bg-blobs">
                <div class="blob blob1"></div>
                <div class="blob blob2"></div>
            </div>
            <button class="btn-settings">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
            
            <div class="avatar-wrap">👤</div>
            <h1 class="profile-name">Mila Novelia</h1>
            <p class="profile-level">Intermediate Learner</p>
        </div>

        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val">570</div>
                    <div class="stat-label">Total Poin (XP)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val">20</div>
                    <div class="stat-label">Quiz Selesai</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val">85%</div>
                    <div class="stat-label">Rata-rata Nilai</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val">5 Hari</div>
                    <div class="stat-label">Streak Belajar</div>
                </div>
            </div>
            
            <div class="logout-wrap">
                <button class="btn-logout" onclick="if(confirm('Yakin ingin keluar?')) window.location.href='welcome.html'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </button>
            </div>
        </div>

        <!-- Bottom Navbar -->
        <div class="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </a>
            <a href="recent-results.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                <span>Bookmark</span>
            </a>
            <a href="materi-list.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <span>Document</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
