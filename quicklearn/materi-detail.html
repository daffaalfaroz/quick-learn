<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLearn - Materi Detail</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .header-bg { background: var(--gradient); padding: 24px 24px 20px; position: relative; text-align: center; }
        .btn-back { position: absolute; left: 24px; top: 24px; color: white; }
        .header-title { color: white; font-size: 22px; font-weight: 800; }
        .header-sub { color: white; font-size: 14px; }
        
        .banner { background: #E8F0FE; padding: 16px 24px; text-align: center; }
        .banner-text { color: var(--text-gray); font-style: italic; font-size: 14px; }
        
        .timeline-container { padding: 20px 24px 40px; position: relative; }
        .timeline-line { position: absolute; left: 34px; top: 40px; bottom: 40px; width: 2px; background: #D0D0D0; z-index: 1; }
        
        .video-card { display: flex; align-items: center; margin-bottom: 24px; position: relative; z-index: 2; }
        .timeline-dot { width: 12px; height: 12px; border-radius: 50%; background: #D0D0D0; margin-right: 16px; flex-shrink: 0; margin-left: 4px; }
        .timeline-dot.active { background: var(--primary-blue); box-shadow: 0 0 0 4px rgba(21, 101, 192, 0.2); }
        
        .card-content {
            background: white; border-radius: 16px; padding: 12px; display: flex; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); flex: 1; gap: 12px; text-decoration: none; color: inherit;
        }
        .thumbnail { width: 80px; height: 80px; border-radius: 10px; background: #E0E0E0; flex-shrink: 0; background-image: url('https://placehold.co/80x80/29B6F6/ffffff?text=Video'); background-size: cover; }
        .video-info { flex: 1; }
        .video-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; color: var(--text-dark); }
        .video-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .xp-reward { color: #FFA000; font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .duration { color: var(--text-gray); }
        .btn-download { width: 32px; height: 32px; border-radius: 50%; background: #F0F0F0; display: flex; align-items: center; justify-content: center; color: var(--text-gray); }
    </style>
</head>
<body>
    <div class="app-container w-600" style="margin: 0 auto;">
        <div class="header-bg">
            <button class="btn-back" onclick="window.history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <h1 class="header-title">BIOLOGI</h1>
            <p class="header-sub">Kelas 10</p>
        </div>

        <div class="banner">
            <p class="banner-text">"Pelajari konsep dasar biologi melalui video interaktif"</p>
        </div>

        <div class="timeline-container">
            <div class="timeline-line"></div>
            
            <div class="video-card">
                <div class="timeline-dot"></div>
                <a href="video-player.html" class="card-content">
                    <div class="thumbnail"></div>
                    <div class="video-info">
                        <div class="video-title">Ruang lingkup biologi</div>
                        <div class="video-meta">
                            <span class="xp-reward">⭐ +20 XP</span>
                            <span class="duration">05:30</span>
                        </div>
                    </div>
                    <div class="btn-download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></div>
                </a>
            </div>

            <div class="video-card">
                <div class="timeline-dot"></div>
                <a href="video-player.html" class="card-content">
                    <div class="thumbnail"></div>
                    <div class="video-info">
                        <div class="video-title">Ekosistem</div>
                        <div class="video-meta">
                            <span class="xp-reward">⭐ +10 XP</span>
                            <span class="duration">05:00</span>
                        </div>
                    </div>
                    <div class="btn-download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></div>
                </a>
            </div>

            <div class="video-card">
                <div class="timeline-dot active"></div>
                <a href="video-player.html" class="card-content">
                    <div class="thumbnail"></div>
                    <div class="video-info">
                        <div class="video-title">Sel Tumbuhan</div>
                        <div class="video-meta">
                            <span class="xp-reward">⭐ +10 XP</span>
                            <span class="duration">06:00</span>
                        </div>
                    </div>
                    <div class="btn-download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></div>
                </a>
            </div>

            <div class="video-card">
                <div class="timeline-dot"></div>
                <a href="video-player.html" class="card-content">
                    <div class="thumbnail"></div>
                    <div class="video-info">
                        <div class="video-title">Virus</div>
                        <div class="video-meta">
                            <span class="xp-reward">⭐ +40 XP</span>
                            <span class="duration">07:00</span>
                        </div>
                    </div>
                    <div class="btn-download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></div>
                </a>
            </div>
            
            <div class="video-card">
                <div class="timeline-dot"></div>
                <a href="video-player.html" class="card-content">
                    <div class="thumbnail"></div>
                    <div class="video-info">
                        <div class="video-title">Plantae</div>
                        <div class="video-meta">
                            <span class="xp-reward">⭐ +10 XP</span>
                            <span class="duration">04:30</span>
                        </div>
                    </div>
                    <div class="btn-download"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
