<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLearn - Recent Results</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-bg {
            background: linear-gradient(180deg, #1565C0, #00BCD4 50%, #E8F4FD);
            min-height: 100vh; display: flex; flex-direction: column; position: relative;
        }
        .bg-blobs { position: absolute; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
        .blob { position: absolute; border-radius: 50%; background: white; opacity: 0.1; }
        .blob1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .blob2 { width: 400px; height: 400px; bottom: 20%; right: -150px; }
        
        .header-section { padding: 32px 24px; position: relative; z-index: 10; display: flex; flex-direction: column; }
        .btn-back { color: white; margin-bottom: 24px; display: inline-flex; }
        .header-top { display: flex; justify-content: space-between; align-items: flex-end; }
        .header-title { color: white; font-size: 28px; font-weight: 800; }
        .header-link { color: rgba(255,255,255,0.7); font-size: 13px; text-decoration: none; }
        
        .results-list {
            background: white; border-radius: 20px 20px 0 0; padding: 24px;
            flex: 1; position: relative; z-index: 10; display: flex; flex-direction: column; gap: 12px; margin-top: 16px;
        }
        .result-item {
            background: white; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }
        .item-number {
            width: 40px; height: 40px; border-radius: 50%; background: var(--gradient); color: white;
            display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0;
        }
        .item-content { flex: 1; }
        .item-title { font-weight: 700; font-size: 16px; color: var(--text-dark); margin-bottom: 8px; }
        .progress-bg { height: 6px; background: #E0E0E0; border-radius: 10px; overflow: hidden; width: 100%; }
        .progress-fill { height: 100%; background: var(--gradient); border-radius: 10px; }
        .item-score { font-weight: 800; color: var(--primary-blue); font-size: 16px; }
    </style>
</head>
<body>
    <div class="app-container w-600 page-bg" style="margin: 0 auto;">
        <div class="bg-blobs">
            <div class="blob blob1"></div>
            <div class="blob blob2"></div>
        </div>

        <div class="header-section">
            <button class="btn-back" onclick="window.history.back()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <div class="header-top">
                <h1 class="header-title">Hasil Terbaru</h1>
                <a href="#" class="header-link">Lihat semuanya..</a>
            </div>
        </div>

        <div class="results-list">
            <div class="result-item">
                <div class="item-number">1</div>
                <div class="item-content">
                    <div class="item-title">Biologi</div>
                    <div class="progress-bg"><div class="progress-fill" style="width: 65%;"></div></div>
                </div>
                <div class="item-score">13/20</div>
            </div>
            <div class="result-item">
                <div class="item-number">2</div>
                <div class="item-content">
                    <div class="item-title">Matematika</div>
                    <div class="progress-bg"><div class="progress-fill" style="width: 80%;"></div></div>
                </div>
                <div class="item-score">16/20</div>
            </div>
            <div class="result-item">
                <div class="item-number">3</div>
                <div class="item-content">
                    <div class="item-title">Kimia</div>
                    <div class="progress-bg"><div class="progress-fill" style="width: 45%;"></div></div>
                </div>
                <div class="item-score">09/20</div>
            </div>
            <div class="result-item">
                <div class="item-number">4</div>
                <div class="item-content">
                    <div class="item-title">Ekonomi</div>
                    <div class="progress-bg"><div class="progress-fill" style="width: 85%;"></div></div>
                </div>
                <div class="item-score">17/20</div>
            </div>
            <div class="result-item">
                <div class="item-number">5</div>
                <div class="item-content">
                    <div class="item-title">Pemograman</div>
                    <div class="progress-bg"><div class="progress-fill" style="width: 100%;"></div></div>
                </div>
                <div class="item-score">20/20</div>
            </div>
        </div>

        <!-- Bottom Navbar -->
        <div class="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
            </a>
            <a href="recent-results.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                <span>Bookmark</span>
            </a>
            <a href="materi-list.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <span>Document</span>
            </a>
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
            </a>
        </div>
    </div>
</body>
</html>
